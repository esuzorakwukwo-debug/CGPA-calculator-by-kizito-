<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A premium CGPA calculator for Nigerian university students using a 5.0 scale. Track. Improve. Graduate Strong." />
    <meta property="og:title" content="CGPA Pro by Kizito" />
    <meta property="og:description" content="A premium CGPA calculator for Nigerian university students using a 5.0 scale. Track. Improve. Graduate Strong." />
    <meta name="theme-color" content="#7c3aed" />
    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CGPA Pro" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json">
    <title>CGPA Pro by Kizito</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('cgpa-pro-theme');
        if (savedTheme === 'false') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
